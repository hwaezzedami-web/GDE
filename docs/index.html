.hero .sub { color: #FFE4EF; font-size: 14px; }
.hero .big { font-size: 23px; font-weight: 800; margin: 8px 0 4px; }

.quick::-webkit-scrollbar { display: none; }

/* sheet + toast */

const $ = (sel, root = document) => root.querySelector(sel);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : String(k));
  return e;
}
const now = () => Date.now();
const pad2 = n => String(n).padStart(2, '0');
const hhmm = t => { const d = new Date(t); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const ddmmyyyy = t => { const d = new Date(t); return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear(); };
const money = v => Number(v || 0).toLocaleString('en-US');
function sameDay(a, b) { a = new Date(a); b = new Date(b); return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function whenText(t) {
  if (sameDay(t, now())) return 'اليوم ' + hhmm(t);
  if (sameDay(t, now() + 864e5)) return 'غداً ' + hhmm(t);
  if (sameDay(t, now() - 864e5)) return 'أمس ' + hhmm(t);

}
function plural(n, one, two, few, many) {
  if (n === 1) return one; if (n === 2) return two;
  if (n >= 3 && n <= 10) return n + ' ' + few; return n + ' ' + many;
}
const days = n => n === 0 ? '0 يوم' : plural(n, 'يوم واحد', 'يومان', 'أيام', 'يوماً');
const ORD = ['', 'الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة', 'السابعة', 'الثامنة', 'التاسعة', 'العاشرة'];
const ordinal = n => ORD[n] || ('رقم ' + n);
function today0() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function daysUntil(m, d) {
  const t = today0();
  const clamp = (y) => Math.min(d, new Date(y, m + 1, 0).getDate());
  let n = new Date(t.getFullYear(), m, clamp(t.getFullYear()));
  if (n < t) n = new Date(t.getFullYear() + 1, m, clamp(t.getFullYear() + 1));

}

  const n = new Date(today0().getTime() + du * 864e5);
  return n.getFullYear() - y;
}
const newId = (arr) => Math.max(arr.reduce((m, o) => Math.max(m, Number(o.id) || 0), 0) + 1, now() * 1000 + Math.floor(Math.random() * 1000));

// bottom sheet ------------------------------------------------------
function sheet(title, body, actions = []) {

// ====================================================================
// Firebase over REST
// ====================================================================
async function http(method, url, body, type = 'application/json') {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = type; opt.body = typeof body === 'string' && type !== 'application/json' ? body : JSON.stringify(body); }
  const r = await fetch(url, opt);
  const txt = await r.text();
  if (!r.ok) { const e = new Error(txt); e.status = r.status; e.body = txt; throw e; }
  return txt ? JSON.parse(txt) : null;
}
function errorText(e) {
  const b = (e && (e.body || e.message)) || '';
  if (/EMAIL_EXISTS/.test(b)) return 'هذا البريد مسجل من قبل، استعملي «لدي حساب»';
  if (/EMAIL_NOT_FOUND|INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS/.test(b)) return 'البريد أو كلمة السر غير صحيحة';
  if (/WEAK_PASSWORD/.test(b)) return 'كلمة السر قصيرة: 6 أحرف على الأقل';
  if (/INVALID_EMAIL/.test(b)) return 'البريد الإلكتروني غير صحيح';
  if (/CONFIGURATION_NOT_FOUND|OPERATION_NOT_ALLOWED/.test(b)) return 'خدمة الحسابات غير مفعّلة في Firebase بعد';
  if (/TOO_MANY_ATTEMPTS/.test(b)) return 'محاولات كثيرة، انتظري قليلاً';
  if (/Permission denied/.test(b)) return 'رُفض الوصول';
  if (e && e.arabic) return e.message;
  if (e instanceof TypeError) return 'لا يوجد اتصال بالإنترنت';
  return 'حدث خطأ، حاولي مرة أخرى';
}
function arabic(msg) { const e = new Error(msg); e.arabic = true; return e; }

async function authCall(endpoint, body) {
  return http('POST', CFG.authBase + endpoint + '?key=' + encodeURIComponent(CFG.key), body);
}
function saveAuth(r, email) {
  S.uid = r.localId; S.token = r.idToken; S.refresh = r.refreshToken; S.email = email;
  S.exp = now() + ((Number(r.expiresIn) || 3600) - 120) * 1000; save(); swAuth();
}
let refreshing = null;
async function token() {
  if (S.token && now() < (S.exp || 0)) return S.token;
  if (!S.refresh) throw arabic('يجب تسجيل الدخول');
  if (!refreshing) refreshing = (async () => {
    try {
      const r = await http('POST', CFG.tokenBase + '?key=' + encodeURIComponent(CFG.key),
        'grant_type=refresh_token&refresh_token=' + encodeURIComponent(S.refresh), 'application/x-www-form-urlencoded');
      S.token = r.id_token; S.refresh = r.refresh_token || S.refresh;
      S.exp = now() + ((Number(r.expires_in) || 3600) - 120) * 1000; save(); swAuth();
      return S.token;
    } finally { refreshing = null; }
  })();

}
const dbUrl = async (path, query) => `${CFG.db}/${path}.json?auth=${encodeURIComponent(await token())}${query ? '&' + query : ''}${CFG.q}`;

// live streams (Server-Sent Events) ---------------------------------
function stream(path, query, onEvent) {
  let es = null, closed = false, backoff = 2000, timer = null;
  const handle = (ev) => { backoff = 2000; try { const d = JSON.parse(ev.data); onEvent(ev.type, d.path, d.data); } catch (e) {} };
  async function open() {
    if (closed) return;
    try {
      es = new EventSource(await dbUrl(path, query));
      es.addEventListener('put', handle);
      es.addEventListener('patch', handle);
      es.addEventListener('auth_revoked', () => { S.exp = 0; reopen(500); });
      es.addEventListener('cancel', () => reopen(30000));
      es.onerror = () => { if (es && es.readyState === 2) reopen(); };
    } catch (e) { reopen(); }
  }
  function reopen(delay) {
    if (es) es.close(); es = null;
    if (closed) return;
    clearTimeout(timer); timer = setTimeout(open, delay || backoff); backoff = Math.min(backoff * 2, 60000);
  }
  open();
  return { close() { closed = true; clearTimeout(timer); if (es) es.close(); }, restart() { backoff = 2000; reopen(10); } };
}
function setAt(root, path, val) {
  const segs = path.split('/').filter(Boolean);
  const remove = val === null || val === undefined;
  if (Array.isArray(val)) val = Object.fromEntries(val.map((v, i) => [String(i), v]).filter(([, v]) => v != null));
  if (!segs.length) return (val && typeof val === 'object') ? val : {};
  let cur = root;
  for (const s of segs.slice(0, -1)) {
    if (!cur[s] || typeof cur[s] !== 'object') { if (remove) return root; cur[s] = {}; }
    cur = cur[s];
  }
  const last = segs[segs.length - 1];
  if (remove) delete cur[last]; else cur[last] = val;
  return root;
}

  if (ev === 'patch' && data && typeof data === 'object') {
    for (const [k, v] of Object.entries(data)) root = setAt(root, path + '/' + k, v);
    return root;
  }
  return setAt(root, path, data);
}

function readCode(text) {

      const js = JSON.parse(decodeURIComponent(escape(atob(b64))));
      if (js.c) return String(js.c);
    } catch (e) {}
  }
  const d = text.replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).match(/\b(\d{6})\b/);
  return d ? d[1] : null;
}

function startStreams() {

function listOf(key) {
  return Object.values(shared[key] || {}).filter(o => o && typeof o === 'object').sort((a, b) => (Number(a.id) || 0) - (Number(b.id) || 0));
}
/** Writes changed/removed items of one shared list as a single PATCH (same format as Android). */
async function saveList(key, next) {
  const before = new Map(listOf(key).map(o => ['i' + o.id, JSON.stringify(o)]));
  const after = new Map(next.map(o => ['i' + o.id, o]));
  const diff = {};
  for (const [k, o] of after) if (before.get(k) !== JSON.stringify(o)) diff[k] = o;
  for (const k of before.keys()) if (!after.has(k)) diff[k] = null;
  if (!Object.keys(diff).length) return;
  for (const [k, v] of Object.entries(diff)) shared = setAt(shared, key + '/' + k, v); // optimistic
  onData('shared');
  try { await patch(base() + '/shared/' + key, diff); }
  catch (e) { toast('لم يُحفظ 😢 ' + errorText(e)); }
}

function onInbox(path, data) {
  const items = [];
  if (path === '/' && data && typeof data === 'object') items.push(...Object.entries(data));
  else if (data && typeof data === 'object' && path.split('/').filter(Boolean).length === 1) items.push([path.replace(/\//g, ''), data]);
  for (const [k, v] of items) {
    if (!v || handledInbox.has(k)) continue;
    handledInbox.add(k);
    const inChat = tab === 'chat' && document.visibilityState === 'visible';
    if (!(inChat && ['msg', 'miss', 'mood'].includes(v.kind))) toast((v.title || '') + ' — ' + (v.text || ''));
    if (v.kind === 'miss' && navigator.vibrate) navigator.vibrate([120, 120, 120, 500, 120, 120, 120]);
    del(base() + '/inbox/' + S.uid + '/' + k).catch(() => {});
  }
}

// notifications (Web Push; the Android app sends them)
// ====================================================================
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
function pushState() {
  if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported';
  return Notification.permission === 'granted' && S.pushOn ? 'on' : 'off';
}
async function enablePush() {
  if (pushState() === 'unsupported') {
    sheet('🔔 الإشعارات', el('p', {}, isIOS && !standalone
      ? 'على الآيفون تعمل الإشعارات فقط بعد تثبيت التطبيق: زر المشاركة ⬆️ ← «إضافة إلى الشاشة الرئيسية»، ثم افتحيه من أيقونته واضغطي هذا الزر مجدداً.'
      : 'هذا المتصفح لا يدعم الإشعارات.'), [{ label: 'حسناً', fn: closeSheet }]);
    return;
  }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('لم يتم السماح بالإشعارات'); return; }
    const reg = await navigator.serviceWorker.ready;
    if (!S.vapid) {
      const kp = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
      const jwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
      S.vapid = { pub: b64u(await crypto.subtle.exportKey('raw', kp.publicKey)), d: jwk.d, x: jwk.x, y: jwk.y }; save();
    }
    let sub = await reg.pushManager.getSubscription();
    if (sub) {
      const k = sub.options && sub.options.applicationServerKey;
      if (!k || b64u(k) !== S.vapid.pub) { await sub.unsubscribe(); sub = null; }
    }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64u(S.vapid.pub) });
    const j = sub.toJSON();
    await put(base() + '/push/' + S.uid, { endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, vapid: S.vapid, t: now() });
    S.pushOn = true; save(); await swAuth();
    toast('🔔 تم تفعيل الإشعارات 💕');
  } catch (e) {
    toast('تعذّر تفعيل الإشعارات: ' + errorText(e));
  }
}

  for (const [k, m] of sending) rows.push([k, m, true]);
  if (!rows.length) box.append(el('div', { class: 'empty' }, 'ابدئي أول رسالة حب 💌'));
  let lastDay = '';
  const toRead = {};
  for (const [k, m, pending] of rows) {
    const t = Number(m.t) || now();
    const day = sameDay(t, now()) ? 'اليوم' : sameDay(t, now() - 864e5) ? 'أمس' : ddmmyyyy(t);
    if (day !== lastDay) { lastDay = day; box.append(el('div', { class: 'day' }, day)); }
    const mine = m.from === S.uid;
    let meta = hhmm(t);
    if (mine) meta += pending ? '  🕓' : m.read ? '  ✓✓' : '  ✓';
    const b = el('div', { class: 'msg ' + (mine ? 'me' : 'them') + (m.type === 'miss' ? ' miss' : '') },
      el('div', {}, m.text || ''), el('div', { class: 'meta', style: mine && m.read ? 'font-weight:700' : '' }, meta));
    if (!pending) b.addEventListener('contextmenu', e => { e.preventDefault(); msgMenu(k, m, mine); });
    if (!pending) longPress(b, () => msgMenu(k, m, mine));
    box.append(b);
    if (!pending && !mine && !m.read && !markedRead.has(k)) { toRead[k + '/read'] = true; markedRead.add(k); }
  }
  if (atBottom || rows.length < 30 || sending.size) box.scrollTop = box.scrollHeight;
  if (Object.keys(toRead).length && document.visibilityState === 'visible') patch(base() + '/messages', toRead).catch(() => {});
}
function longPress(node, fn) {
  let t;
  node.addEventListener('touchstart', () => { t = setTimeout(fn, 550); }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach(ev => node.addEventListener(ev, () => clearTimeout(t), { passive: true }));
}
function msgMenu(k, m, mine) {
  const opts = ['📋 نسخ']; if (mine) opts.push('🗑️ حذف للجميع');
  choose('الرسالة', opts, i => {
    if (i === 0) { navigator.clipboard && navigator.clipboard.writeText(m.text || ''); toast('تم النسخ'); }
    else del(base() + '/messages/' + k).catch(() => toast('تعذّر الحذف'));
  });
}
async function send(text, type) {
  const tmp = '~' + now() + Math.random();
  sending.set(tmp, { from: S.uid, text, type, t: now() });
  renderMessages();
  try {
    await post(base() + '/messages', { from: S.uid, text, type, t: SERVER_TIME, read: false });
    sending.delete(tmp); renderMessages();
    try {
      if (type === 'miss') await sendInbox('miss', '💗 ' + S.name, 'مشتاقة لك كثيراً 🥺');
      else await sendInbox('msg', '💬 ' + S.name, text);
    } catch (e) {}
  } catch (e) {
    sending.delete(tmp); renderMessages(); toast('لم تُرسل 😢 ' + errorText(e));
  }
}
function presence(online) {
  if (!linked()) return;
  patch(base() + '/profiles/' + S.uid, { online, lastSeen: now(), name: S.name || 'بشرى', role: 'wife' }).catch(() => {});
}

  const items = listOf('coupons');
  const active = items.filter(o => !o.used);
  wrap.append(el('div', { class: 'card', style: 'background:var(--pink-soft);border:0;text-align:center;color:var(--pink-dark);font-weight:700' },
    '🎟️ كوبونات الحب', el('br'), el('span', { style: 'font-weight:400;font-size:14px' }, 'هدايا من زوجك، استعمليها متى شئتِ وعليه التنفيذ 😄')));
  wrap.append(el('h3', { class: 'sec' }, el('span', { class: 'grow' }, `✨ متاحة (${active.length})`), el('button', { class: 'btn soft', onclick: addCoupon }, '➕ كوبون')));
  active.forEach(o => wrap.append(ticket(o)));
  const used = items.filter(o => o.used);
  if (used.length) { wrap.append(el('h3', { class: 'sec' }, '✔ مُستعملة')); used.forEach(o => wrap.append(ticket(o))); }
  return wrap;
}
function ticket(o) {
  const t = el('div', { class: 'ticket' + (o.used ? ' used' : '') }, el('div', { class: 'e' }, o.emoji || '🎟️'),
    el('div', { class: 'grow' }, el('div', { class: 't' }, 'كوبون: ' + o.title), el('div', { class: 's' }, o.used ? 'استُعمل في ' + ddmmyyyy(o.usedDate || now()) : 'صالح دائماً 💕')));
  if (!o.used) {
    t.append(el('button', { class: 'btn white', onclick: () => confirmSheet((o.emoji || '') + ' استعمال الكوبون؟', o.title, 'نعم 💝', () => {
      updateItem('coupons', o.id, { used: true, usedDate: now() });
      toast('🎉 تم! أرسلته له، وعليه التنفيذ الآن 😄');
      notifyPartner('coupon', '🎟️ ' + S.name, 'استعملت كوبون: ' + (o.emoji || '') + ' ' + o.title + ' — نفّذ الآن 😄');
    }) }, '💝 استعمال'));
  } else {
    t.append(el('button', { class: 'x', onclick: () => choose(o.title, ['♻️ إعادة تفعيل', '🗑️ حذف'], i => {
      if (i === 0) updateItem('coupons', o.id, { used: false });
      else saveList('coupons', listOf('coupons').filter(x => x.id !== o.id));
    }) }, '⋯'));
  }
  return t;
}
function addCoupon() {
  const emoji = el('input', { class: 'field', value: '🎟️' });
  const title = el('input', { class: 'field', placeholder: 'الكوبون (مثل: رحلة نهاية الأسبوع)' });
  sheet('🎟️ كوبون جديد', el('div', {}, emoji, title), [{ label: 'إضافة', fn: () => {
    const tt = title.value.trim(); if (!tt) return;
    const list = listOf('coupons');
    list.push({ id: newId(list), emoji: emoji.value.trim() || '🎟️', title: tt, used: false, usedDate: 0 });
    saveList('coupons', list); closeSheet();
  } }, { label: 'إلغاء', ghost: true, fn: closeSheet }]);
}

// ====================================================================
// ⏰ my reminders (on this phone)
// ====================================================================
const MY_DEFAULTS = [['💋', 'قبّليه', 120], ['🤗', 'احضنيه', 180], ['❤️', 'قولي له: أحبك', 240], ['😊', 'ابتسمي له', 180], ['👀', 'انظري في عينيه', 240],
  ['🌹', 'امدحيه', 300], ['📱', 'أرسلي له رسالة حب', 180], ['📞', 'اتصلي واسألي عنه', 360], ['😂', 'أضحكيه', 240], ['🙌', 'اشكريه على تعبه', 480],
  ['👂', 'استمعي ليومه', 480], ['🤲', 'ادعي له', 360], ['💧', 'ذكّريه يشرب ماء', 120], ['☀️', 'صباح الخير يا حبيبي', 1440], ['🌙', 'تصبح على خير', 1440],
  ['☕', 'حضّري له قهوته', 1440], ['🍰', 'حلوى يحبها', 4320], ['📸', 'صورة معه', 4320], ['🎁', 'مفاجأة صغيرة', 10080], ['🎬', 'سهرة معاً', 10080], ['💌', 'رسالة بخط يدك', 10080]];
const INTERVALS = [30, 60, 120, 180, 240, 300, 360, 480, 720, 1440, 2880, 4320, 10080];
function intervalText(m) {
  if (m < 60) return 'كل ' + m + ' دقيقة'; if (m === 60) return 'كل ساعة'; if (m === 120) return 'كل ساعتين';
  if (m < 1440) return 'كل ' + (m / 60) + (m / 60 <= 10 ? ' ساعات' : ' ساعة');
  if (m === 1440) return 'يومياً'; if (m === 2880) return 'كل يومين'; if (m === 10080) return 'أسبوعياً'; return 'كل ' + (m / 1440) + ' أيام';
}
function quietAdjust(t) { const d = new Date(t); const h = d.getHours(); if (h >= 23 || h < 8) { if (h >= 23) d.setDate(d.getDate() + 1); d.setHours(8, 0, 0, 0); return d.getTime(); } return t; }
function myReminders() {
  if (!S.myReminders) { S.myReminders = MY_DEFAULTS.map(([e, t, m], i) => ({ id: i + 1, emoji: e, title: t, interval: m, next: quietAdjust(now() + m * 6e4), today: 0, todayDate: '', total: 0, on: true })); save(); }
  const key = new Date().toDateString();
  for (const r of S.myReminders) if (r.todayDate !== key) r.today = 0;
  return S.myReminders;
}
function mineView() {
  const wrap = el('div');
  const list = myReminders();
  const total = list.reduce((s, r) => s + (r.todayDate === new Date().toDateString() ? r.today : 0), 0);
  wrap.append(el('div', { style: 'text-align:center' }, el('span', { class: 'pill', style: 'box-shadow:0 1px 3px rgba(0,0,0,.08)' }, '❤️ أنجزتِ اليوم: ' + total + ' ❤️')));
  wrap.append(el('p', { class: 'muted', style: 'padding:0 6px' }, 'الآيفون لا يسمح لتطبيقات الويب بالتذكير وهي مغلقة، لذلك يظهر هنا ما حان وقته عندما تفتحين التطبيق 💕. لا تذكيرات من 11 ليلاً حتى 8 صباحاً.'));
  const due = list.filter(r => r.on && r.next <= now()).sort((a, b) => a.next - b.next);
  const rest = list.filter(r => !(r.on && r.next <= now()));
  if (due.length) { wrap.append(el('h3', { class: 'sec' }, '🔔 حان وقتها')); due.forEach(r => wrap.append(remCard(r, true))); }
  wrap.append(el('h3', { class: 'sec' }, '⏰ تذكيراتي'));
  rest.sort((a, b) => (b.on - a.on) || (a.next - b.next)).forEach(r => wrap.append(remCard(r, false)));
  return wrap;
}
function remCard(r, due) {
  const card = el('div', { class: 'card row' + (r.on ? '' : ' off'), style: due ? 'border:2px solid var(--pink)' : '' },
    el('div', { class: 'bubble-e' }, r.emoji),
    el('button', { class: 'grow', style: 'background:none;text-align:right;padding:0', onclick: () => remMenu(r) },
      el('div', { class: 'title', style: r.on ? '' : 'color:var(--gray)' }, r.title),
      el('div', { class: 'muted' }, '⏱ ' + intervalText(r.interval) + '  •  ' + (r.on ? (due ? 'الآن!' : 'التالي: ' + whenText(r.next)) : 'متوقف')),
      el('div', { class: 'muted', style: 'color:var(--pink)' }, '✅ اليوم: ' + r.today + '   •   المجموع: ' + r.total)),
    el('button', { class: 'btn', disabled: !r.on, onclick: () => remDone(r) }, 'تم ✓'));
  return card;
}
function remDone(r) {
  const key = new Date().toDateString();
  if (r.todayDate !== key) { r.todayDate = key; r.today = 0; }
  r.today++; r.total++; r.next = quietAdjust(now() + r.interval * 6e4); save();
  const praise = ['أحسنتِ يا ملكة ❤️', 'زوجك محظوظ بكِ 💕', 'ما أجمل حبكما 🥰', 'زوجة رائعة! 🌹', 'الحب يكبر كل يوم 💖'];
  toast(praise[Math.floor(Math.random() * praise.length)]);
  if (S.tellPartner !== false) notifyPartner('done', r.emoji + ' ' + S.name, 'أنجزت من أجلك: ' + r.title + ' 💕');
  renderTab();
}
function remMenu(r) {
  choose(r.emoji + ' ' + r.title, ['⏱ تغيير التكرار', r.on ? '⏸️ إيقاف' : '▶️ تشغيل', '🗑️ حذف', '➕ تذكير جديد'], i => {
    if (i === 0) choose('⏱ كم مرة؟', INTERVALS.map(intervalText), j => { r.interval = INTERVALS[j]; r.next = quietAdjust(now() + r.interval * 6e4); save(); renderTab(); });
    else if (i === 1) { r.on = !r.on; if (r.on) r.next = quietAdjust(now() + r.interval * 6e4); save(); renderTab(); }
    else if (i === 2) confirmSheet('حذف التذكير؟', r.title, 'حذف', () => { S.myReminders = S.myReminders.filter(x => x.id !== r.id); save(); renderTab(); });
    else addReminder();
  });
}
function addReminder() {
  const emoji = el('input', { class: 'field', value: '💗' });
  const title = el('input', { class: 'field', placeholder: 'نص التذكير' });
  sheet('➕ تذكير جديد', el('div', {}, emoji, title), [{ label: 'التالي: التكرار', fn: () => {
    const t = title.value.trim(); if (!t) return; closeSheet();
    choose('⏱ كم مرة؟', INTERVALS.map(intervalText), j => {
      const list = myReminders();
      list.unshift({ id: newId(list), emoji: emoji.value.trim() || '💗', title: t, interval: INTERVALS[j], next: quietAdjust(now() + INTERVALS[j] * 6e4), today: 0, todayDate: '', total: 0, on: true });
      save(); renderTab();
    });
  } }, { label: 'إلغاء', ghost: true, fn: closeSheet }]);
}
let lastDueCount = -1;
function checkDue() {
  if (!linked()) return;
  const due = myReminders().filter(r => r.on && r.next <= now());
  if (due.length && due.length !== lastDueCount && tab !== 'mine') toast('⏰ ' + due[0].emoji + ' ' + due[0].title + (due.length > 1 ? ' (+' + (due.length - 1) + ')' : ''));
  lastDueCount = due.length;
  if (tab === 'mine' && !editing() && !$('#sheet').classList.contains('open')) renderTab();
}

// ====================================================================
// start
// ====================================================================
if ('serviceWorker' in navigator && !CFG.q) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.tab) go(e.data.tab); });
}
document.addEventListener('visibilitychange', () => {
  if (!linked()) return;
  if (document.visibilityState === 'visible') { streams.forEach(s => s.restart()); presence(true); renderTab(); checkDue(); }
  else presence(false);
});
setInterval(() => { if (tab === 'chat') updateChatHeader(); }, 4000);
setInterval(() => { if (document.visibilityState === 'visible') presence(true); }, 60000);
setInterval(checkDue, 30000);
swAuth();
render();
if (linked()) { startStreams(); presence(true); setTimeout(checkDue, 1500); }
</script>
