# Configuration nginx de l'interface web (conteneur « web » ou serveur Linux).
# En production, terminer TLS ici (bloc 443 ci-dessous) ou sur le reverse proxy de l'entreprise.
server_tokens off;

upstream gsm_api { server api:8000; keepalive 16; }

server {
    listen 8080;
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/certs/gsm.crt;
    # ssl_certificate_key /etc/nginx/certs/gsm.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    client_max_body_size 21m;          # import CSV (20 Mo max côté API)

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # « origin » envoyé aux sites externes : exigé par les serveurs de tuiles OpenStreetMap
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Adapter img-src si le serveur de tuiles cartographiques est différent
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    # Import du référentiel de sites (KMZ / Excel jusqu'à 50 Mo côté API)
    location /api/site-reference/import/ {
        client_max_body_size 60m;
        proxy_pass http://gsm_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://gsm_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # -------------------------------------------------------------------------
    # Prometheus et Alertmanager (pile optionnelle docker-compose.prometheus.yml)
    # publiés sous /prometheus/ et /alertmanager/, protégés par mot de passe :
    #   ./scripts/prometheus_password.sh <utilisateur>   -> config/nginx-auth/htpasswd
    # Le DNS interne de Docker est interrogé à chaque requête : nginx démarre même
    # si la pile Prometheus n'est pas lancée (la page indique alors qu'elle est absente).
    # -------------------------------------------------------------------------
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    location = /prometheus   { return 301 /prometheus/; }
    location = /alertmanager { return 301 /alertmanager/; }

    location /prometheus/ {
        auth_basic "Supervision GSM - Prometheus";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        set $prom_upstream http://prometheus:9090;
        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass $prom_upstream;
        include /etc/nginx/conf.d/outils.inc;
    }

    location /alertmanager/ {
        auth_basic "Supervision GSM - Alertmanager";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        set $am_upstream http://alertmanager:9093;
        rewrite ^/alertmanager/(.*)$ /$1 break;
        proxy_pass $am_upstream;
        include /etc/nginx/conf.d/outils.inc;
    }

    location @outil_absent {
        default_type text/plain;
        return 503 "Prometheus / Alertmanager non demarre. Lancer : docker compose -f docker-compose.yml -f docker-compose.prometheus.yml up -d\n";
    }

    # NB : pas de add_header dans les blocs location ci-dessous (ils masqueraient les en-têtes de sécurité)
    location /assets/ {
        expires 30d;            # fichiers versionnés par le build
    }

    location / {
        try_files $uri /index.html;
        expires -1;             # index.html toujours revalidé
    }
}
