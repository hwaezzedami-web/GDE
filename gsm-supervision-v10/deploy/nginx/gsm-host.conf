# Installation hors Docker : copier dans /etc/nginx/conf.d/ et adapter server_name / certificats.
# Les fichiers de l'interface (frontend/dist) sont copiés dans /var/www/gsm-supervision.
server {
    listen 443 ssl http2;
    server_name supervision-gsm.intranet;          # À ADAPTER
    ssl_certificate     /etc/nginx/certs/gsm.crt;  # À ADAPTER
    ssl_certificate_key /etc/nginx/certs/gsm.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /var/www/gsm-supervision;
    client_max_body_size 21m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # « origin » envoyé aux sites externes : exigé par les serveurs de tuiles OpenStreetMap
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    location /api/site-reference/import/ {      # référentiel de sites (KMZ / Excel, 50 Mo max côté API)
        client_max_body_size 60m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /assets/ { expires 30d; }
    location / { try_files $uri /index.html; expires -1; }
}
server { listen 80; server_name supervision-gsm.intranet; return 301 https://$host$request_uri; }
