# =============================================================================
# Prometheus — exemple de configuration pour la supervision GSM
# Une cible (job) par OMC ; les labels « vendor » et « omc_source » sont ajoutés
# ici et servent aux requêtes du connecteur (contrat : docs/10_PROMETHEUS.md).
# Les cibles « demo-exporter » sont FICTIVES : à remplacer par vos exporteurs.
# =============================================================================
global:
  scrape_interval: 60s          # fréquence de lecture des exporteurs
  scrape_timeout: 50s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gsm-omc-huawei
    metrics_path: /metrics
    params: { vendor: [huawei] }              # propre à l'exporteur de démonstration
    static_configs:
      - targets: ["demo-exporter:9800"]       # À REMPLACER : exporteur de l'OMC Huawei
        labels: { vendor: huawei }

  - job_name: gsm-omc-ericsson
    params: { vendor: [ericsson] }
    static_configs:
      - targets: ["demo-exporter:9800"]       # À REMPLACER : exporteur de l'OMC Ericsson
        labels: { vendor: ericsson }

  - job_name: gsm-omc-zte
    params: { vendor: [zte] }
    static_configs:
      - targets: ["demo-exporter:9800"]       # À REMPLACER : exporteur de l'OMC ZTE
        labels: { vendor: zte }

  # Exporteurs d'OMC par fichiers (node_exporter, collecteur textfile) : le label
  # « vendor » est porté par chaque série (gsm_ne_oper_status{vendor="huawei"…}).
  # Source de l'application : voir docs/12_EXPORTEUR_FICHIERS.md (requêtes à utiliser).
  - job_name: gsm-omc-textfile
    static_configs:
      - targets: ["node-exporter:9100"]
