<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Aboubakr &amp; Bouchra Wallet</title>
<style>
/* Layout: one phone column — sticky header, scrolling cards, fixed tab bar. The square-price board is the signature block. */
:root {
  --bg: #F2F5F3; --surface: #FFFFFF; --surface2: #E8EFEB; --ink: #13201A; --muted: #5A6A63; --line: #D6E0DA;
  --accent: #0A6B4E; --accent-ink: #FFFFFF; --accent-soft: #DCEFE6;
  --board: #0B3D2E; --board-ink: #F3FAF6; --board-dim: #A9C9BA; --euro: #9A6A10;
  --good: #1B8655; --bad: #C2372D; --warn: #A86400;
  --good-soft: #DDF2E6; --bad-soft: #FBE3DF; --warn-soft: #FBEDD5;
  --shadow: 0 1px 2px rgba(19, 32, 26, .06), 0 4px 14px rgba(19, 32, 26, .05);
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", Roboto, "Noto Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1311; --surface: #151E1A; --surface2: #1C2823; --ink: #E3ECE7; --muted: #93A39B; --line: #27342E;
  --accent: #3DBF8E; --accent-ink: #052419; --accent-soft: #173B2E;
  --board: #0F2A21; --board-ink: #EAF6F0; --board-dim: #8DB3A3; --euro: #E2B65C;
  --good: #4CCB8D; --bad: #FF7B6F; --warn: #F2A848;
  --good-soft: #15372A; --bad-soft: #3B1F1B; --warn-soft: #3A2C16;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1311; --surface: #151E1A; --surface2: #1C2823; --ink: #E3ECE7; --muted: #93A39B; --line: #27342E;
  --accent: #3DBF8E; --accent-ink: #052419; --accent-soft: #173B2E;
  --board: #0F2A21; --board-ink: #EAF6F0; --board-dim: #8DB3A3; --euro: #E2B65C;
  --good: #4CCB8D; --bad: #FF7B6F; --warn: #F2A848;
  --good-soft: #15372A; --bad-soft: #3B1F1B; --warn-soft: #3A2C16;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }

.app { max-width: 560px; margin: 0 auto; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  display: flex; align-items: center; gap: 10px; padding-block: 12px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.brand { flex: 1; min-width: 0; }
.brand h1 { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; color: var(--muted); font-size: 12px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-width: 40px; height: 40px; padding: 0 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

main { display: grid; gap: 14px; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.banner { border-radius: var(--r); padding: 10px 12px; font-size: 13px; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); }
.banner.info { background: var(--accent-soft); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 15px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.card h2 .link { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 4px; }
.muted { color: var(--muted); }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px 0; cursor: pointer; font-size: 13px; }
.small { font-size: 12.5px; }

/* the square board */
.board { background: var(--board); color: var(--board-ink); border-radius: 18px; padding: 16px; display: grid; gap: 10px; position: relative; overflow: hidden; }
.board::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 22px, rgba(255,255,255,.035) 22px 23px); pointer-events: none; }
.board .label { font-size: 12.5px; color: var(--board-dim); letter-spacing: .04em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; }
.board .big { font-family: var(--font-display); font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -.01em; direction: ltr; text-align: start; }
.board .big span { font-size: 18px; font-weight: 600; color: var(--board-dim); margin-inline-start: 6px; }
.board .row { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13.5px; color: var(--board-dim); }
.board .row b { color: var(--board-ink); font-weight: 600; }
.board .cta { justify-self: start; position: relative; z-index: 1; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.chip.up { background: var(--good-soft); color: var(--good); }
.chip.down { background: var(--bad-soft); color: var(--bad); }
.chip.flat { background: var(--surface2); color: var(--muted); }
.board .chip.up { background: rgba(76, 203, 141, .18); color: #8FF0BE; }
.board .chip.down { background: rgba(255, 123, 111, .2); color: #FFB3AA; }
.board .chip.flat { background: rgba(255,255,255,.1); color: var(--board-dim); }
.stale { background: rgba(242, 168, 72, .18); color: #FFD69A; border-radius: 10px; padding: 8px 10px; font-size: 13px; }

.btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; }
.btn.ghost { background: var(--surface2); color: var(--ink); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.light { background: var(--board-ink); color: var(--board); }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; box-shadow: var(--shadow); text-align: start; cursor: pointer; display: grid; gap: 2px; }
.tile .k { font-size: 12.5px; color: var(--muted); }
.tile .v { font-family: var(--font-display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .s { font-size: 12px; color: var(--muted); }
.tile.bad .v { color: var(--bad); } .tile.good .v { color: var(--good); } .tile.euro .v { color: var(--euro); }

.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 6px; cursor: pointer; display: grid; justify-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; }
.quick svg { width: 22px; height: 22px; color: var(--accent); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 6px; font-weight: 600; font-size: 13.5px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pills button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
.pills button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.monthbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.monthbar b { font-family: var(--font-display); font-size: 16px; }

.list { display: grid; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); background: none; border-inline: 0; border-top: 0; text-align: start; cursor: pointer; width: 100%; }
.item:last-child { border-bottom: 0; }
.item .t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.item .a { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; text-align: end; white-space: nowrap; }
.item .m { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.a.bad { color: var(--bad); } .a.good { color: var(--good); } .a.euro { color: var(--euro); }
.tag { border-radius: 6px; padding: 1px 7px; font-size: 11.5px; font-weight: 600; }
.tag.bad { background: var(--bad-soft); color: var(--bad); } .tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.good { background: var(--good-soft); color: var(--good); } .tag.neutral { background: var(--surface2); color: var(--muted); }
.stripe-bad { border-inline-start: 4px solid var(--bad); padding-inline-start: 10px; }
.stripe-warn { border-inline-start: 4px solid var(--warn); padding-inline-start: 10px; }

.bar { display: block; height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.bad i { background: var(--bad); } .bar.warn i { background: var(--warn); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: end; font-weight: 600; font-variant-numeric: tabular-nums; }
.kv .total { border-top: 1px solid var(--line); padding-top: 8px; font-size: 15px; color: var(--ink); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface2); border-radius: 12px; padding: 10px; display: grid; gap: 2px; }
.stat .k { font-size: 12px; color: var(--muted); } .stat .v { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 18px 8px; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty svg { width: 34px; height: 34px; color: var(--accent); }
.conv { display: grid; gap: 10px; }
.conv label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.conv .out { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }

input[type=text], input[type=date], input[type=month], select { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 10px; font-size: 16px; }
input.big { font-family: var(--font-display); font-size: 22px; font-weight: 600; }
.field { display: grid; gap: 5px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 12px; color: var(--muted); }

.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); }
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.tabs button { border: 0; background: none; padding: 8px 2px 9px; display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabs svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs button[aria-current="page"] svg { transform: translateY(-1px); }

.scrim { position: fixed; inset: 0; background: rgba(5, 12, 9, .45); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; display: flex; justify-content: center; }
.sheet-in { width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0;
  padding-block: 8px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 12px; box-shadow: 0 -10px 30px rgba(0,0,0,.18); }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); justify-self: center; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-head h3 { font-size: 18px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 140px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.ro [data-write] { display: none !important; }
.seg.five button { font-size: 12px; padding: 8px 2px; }
.check { display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
input[type=time], input[type=password] { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 10px; font-size: 16px; }
.thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; }
.photoview { position: fixed; inset: 0; z-index: 90; background: rgba(0, 0, 0, .9); display: grid; place-items: center; padding: 16px; }
.photoview img { max-width: 100%; max-height: 100%; border-radius: 8px; }
.lock { position: fixed; inset: 0; z-index: 100; background: var(--board); color: var(--board-ink); display: grid; place-items: center; padding: 24px; }
.lock-in { display: grid; gap: 14px; justify-items: center; width: 100%; max-width: 320px; }
.lock-in svg { width: 40px; height: 40px; }
.lock .dots { display: flex; gap: 12px; direction: ltr; }
.lock .dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--board-ink); }
.lock .dots i.on { background: var(--board-ink); }
.keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; direction: ltr; }
.keypad button { height: 64px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .1); color: var(--board-ink); font-size: 24px; font-family: var(--font-display); cursor: pointer; }
.lock .linkbtn { color: var(--board-dim); }
.sel { user-select: all; -webkit-user-select: all; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { .sheet-in { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
@media (min-width: 600px) { main { padding-block: 20px; } }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1 id="brandTitle">Aboubakr &amp; Bouchra</h1><small id="brandSub">Wallet</small></div>
    <button class="iconbtn" type="button" data-act="lang" id="langBtn" aria-label="Language">ع</button>
    <button class="iconbtn" type="button" data-act="go" data-to="prefs" id="prefsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="view" aria-live="polite">

</div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>

<div class="lock" id="lock" hidden></div>
<div class="photoview" id="photoView" hidden data-act="photoclose"><img id="photoImg" alt=""></div>

<script>

function rateChart(R) {
  const end = R.date || todayStr();
  const pts = R.list.filter((r) => { const d = daysBetween(r.date, end); return d >= 0 && d < 60; });
  if (pts.length < 2) return "";
  const W = 320, H = 150, padL = 34, padR = 10, padT = 12, padB = 22;
  const vals = pts.map((p) => num(p.eur));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 2) { lo -= 1; hi += 1; }
  const step = Math.max(1, Math.ceil((hi - lo) / 4));
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x0 = dayNum(end) - 59;
  const X = (d) => padL + ((dayNum(d) - x0) / 59) * (W - padL - padR);
  const Y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p.date).toFixed(1)},${Y(num(p.eur)).toFixed(1)}`).join("");
  const area = `${line}L${X(pts[pts.length - 1].date).toFixed(1)},${(H - padB).toFixed(1)}L${X(pts[0].date).toFixed(1)},${(H - padB).toFixed(1)}Z`;
  let grid = "";
  for (let v = lo; v <= hi + 0.001; v += step) grid += `<line x1="${padL}" x2="${W - padR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 5}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${esc(nf(v))}</text>`;
  const lastP = pts[pts.length - 1];
  const xl = [0, 30, 59].map((k) => { const d = new Date((x0 + k) * 864e5); const s = `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
    return `<text x="${X(s).toFixed(1)}" y="${H - 6}" text-anchor="${k === 0 ? "start" : k === 59 ? "end" : "middle"}">${esc(dmy(s).slice(0, 5))}</text>`; }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" dir="ltr" role="img" aria-label="${esc(t("chartTitle"))}">${grid}
    <path d="${area}" fill="var(--accent-soft)" stroke="none"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${X(lastP.date).toFixed(1)}" cy="${Y(num(lastP.eur)).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>${xl}</svg></div>`;
}

function cashAfter(kind, amount, isIncome, id) {
  const coll = FORMS[kind].coll, prev = id ? S.data[coll].find((x) => x.id === id) : null;
  const prevEffect = prev ? (prev.kind === "income" ? num(prev.amount) : -num(prev.amount)) : 0;
  const now = cashInHand();
  return { now, after: now - prevEffect + (isIncome ? amount : -amount) };
}
function cashPreview() {
  const $ = (id) => document.getElementById(id), out = $("cashPreview"); if (!out || !S.sheet) return;
  const amt = parseNum($("fld_amount") ? $("fld_amount").value : "") || 0;
  const inc = S.sheet.kind === "expense" && $("fld_kind") && $("fld_kind").value === "income";
  const c = cashAfter(S.sheet.kind, amt, inc, S.sheet.id);
  out.textContent = t("inHandNow", { a: da(c.now), b: da(c.after) });
  out.style.color = c.after < 0 ? "var(--bad)" : "";
}
function salePreview(src) {
  const R = rateInfo(), $ = (id) => document.getElementById(id);
  const cur = $("fld_cur") ? $("fld_cur").value : "EUR";
  if (src === "fld_cur" && $("fld_rate")) $("fld_rate").value = String(cur === "USD" ? +R.usd.toFixed(2) : R.eur || "");
  const rate = parseNum($("fld_rate") ? $("fld_rate").value : "");
  if ((src === "fld_needDa" || src === "fld_rate") && $("fld_needDa") && $("fld_amount")) {
    const need = parseNum($("fld_needDa").value);
    if (need > 0 && rate > 0) $("fld_amount").value = String(Math.ceil((need / rate) * 100) / 100);
  }
  const amt = parseNum($("fld_amount") ? $("fld_amount").value : "");
  const out = $("salePreview"); if (!out) return;
  const parts = [];
  if (amt > 0 && rate > 0) parts.push(t("sellGet", { v: da(amt * rate) }));
  let over = false;
  if (cur === "EUR") {
    const mine = S.sheet && S.sheet.id ? num((S.data.sales.find((x) => x.id === S.sheet.id) || {}).amount) : 0;
    const bal = eurBalance() + mine;
    over = amt > bal + 0.001;
    parts.push(over ? t("sellOver", { v: eu(bal) }) : t("inBank", { v: eu(bal) }));
  }
  out.textContent = parts.join(" · ");
  out.style.color = over ? "var(--bad)" : "";
}

function toast(msg) {

  el.textContent = msg; el.hidden = false;
  clearTimeout(toast.tm); toast.tm = setTimeout(() => { el.hidden = true; }, 2600);
}
function writeError(e) {
  const code = e && e.code;
  if (code === "invalid_argument" && S.canWrite !== true) { S.canWrite = false; render(); toast(t("noWrite")); return; }
  if (code === "quota_exceeded") { toast(t("quota")); return; }
  toast(t("errSave", { m: (e && (e.message || e.code)) || "?" }));
}
async function withRetry(fn) {
  try { return await fn(); }
  catch (e) { if (e && e.code === "unavailable") { await new Promise((r) => setTimeout(r, 400 + Math.random() * 600)); return fn(); } throw e; }
}
async function saveDoc(coll, id, obj) {
  if (!S.db) { toast(t("noDb")); return false; }
  try {
    const body = { ...obj, ts: obj.ts || Date.now(), by: S.me };
    const ref = id ? S.db.collection(coll).doc(id) : S.db.collection(coll).doc();
    await withRetry(() => ref.set(body));
    return ref.id || id || true;
  } catch (e) { writeError(e); return false; }
}
async function delDoc(coll, id) {
  if (!S.db) { toast(t("noDb")); return false; }
  try { await withRetry(() => S.db.collection(coll).doc(id).delete()); return true; } catch (e) { writeError(e); return false; }
}
async function saveCfg(patch) {
  if (!S.db) { toast(t("noDb")); return false; }
  const next = { ...S.cfg, ...patch };
  try { await withRetry(() => S.db.doc("config/main").set(next)); S.cfg = next; return true; } catch (e) { writeError(e); return false; }
}
async function submitForm() {
  const sh = S.sheet; if (!sh) return;

  const read = (k) => { const el = document.getElementById("fld_" + k); return el ? el.value : undefined; };
  if (sh.type === "form") {
    const F = FORMS[sh.kind];
    const out = {};
    for (const [label, type, req, , keyOverride] of F.fields) {
      const key = keyOverride || label, raw = read(key);
      if (type === "num") {
        if (raw == null || String(raw).trim() === "") { if (req) return toast(t("required", { f: t("f." + label) })); out[key] = ""; continue; }
        const n = parseNum(raw);
        if (!Number.isFinite(n) || (key !== "amount" || sh.kind !== "saving") && n < 0) return toast(t("badNum", { f: t("f." + label) }));
        if (req && n === 0) return toast(t("required", { f: t("f." + label) }));
        out[key] = n;
      } else {
        const v = (raw || "").trim();
        if (req && !v) return toast(t("required", { f: t("f." + label) }));
        out[key] = v;
      }
    }
    if (sh.kind === "payment") out.debtId = sh.vals.debtId;

/* ------------------------------------------------------------------ on-phone storage */
const LocalDB = (() => {
  const KEY = "wallet.data.v1", bridge = window.AndroidWallet;
  let state = { colls: {}, config: null };
  const subs = {};
  try {
    const raw = bridge ? bridge.load() : localStorage.getItem(KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    if (parsed && parsed.colls) state = { colls: parsed.colls, config: parsed.config || null };
  } catch (e) { /* start empty */ }
  function persist() {
    const raw = JSON.stringify({ app: "aboubakr-wallet", version: 1, colls: state.colls, config: state.config });
    let ok = false;
    try { ok = bridge ? bridge.save(raw) : (localStorage.setItem(KEY, raw), true); } catch (e) { ok = false; }
    if (!ok) throw { code: "storage", message: "the phone refused to save" };
  }
  const emit = (k) => (subs[k] || []).slice().forEach((fn) => fn());
  const listen = (k, fn) => { (subs[k] = subs[k] || []).push(fn); setTimeout(fn, 0); return () => { subs[k] = (subs[k] || []).filter((f) => f !== fn); }; };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const snap = (c) => { const o = state.colls[c] || {}; return { docs: Object.keys(o).map((id) => ({ id, data: () => o[id] })), metadata: { fromCache: false, hasPendingWrites: false } }; };
  return {
    collection(c) {
      return {
        onSnapshot(next) { return listen(c, () => next(snap(c))); },
        doc(id) {
          const docId = id || newId();
          return {
            id: docId,
            async set(obj) { const all = (state.colls[c] = state.colls[c] || {}); const before = all[docId]; all[docId] = clone(obj);
              try { persist(); } catch (e) { if (before === undefined) delete all[docId]; else all[docId] = before; throw e; } emit(c); },
            async delete() { const all = state.colls[c] || {}; const before = all[docId]; delete all[docId];
              try { persist(); } catch (e) { if (before !== undefined) all[docId] = before; throw e; } emit(c); },
          };
        },
      };
    },
    doc() {
      return {
        onSnapshot(next) { return listen("config", () => next({ exists: !!state.config, data: () => state.config || undefined })); },
        async set(obj) { const before = state.config; state.config = clone(obj); try { persist(); } catch (e) { state.config = before; throw e; } emit("config"); },
      };
    },
    exportAll() { return { app: "aboubakr-wallet", version: 1, saved: new Date().toISOString(), colls: clone(state.colls), config: clone(state.config) }; },
    importAll(obj) { const before = state; state = { colls: clone(obj.colls), config: obj.config ? clone(obj.config) : null };
      try { persist(); } catch (e) { state = before; throw e; } Object.keys(subs).forEach(emit); },
  };
})();
function b64utf8(text) {

  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

}

  if (dark === undefined && b && b.isDark) { try { dark = b.isDark(); } catch (e) { dark = undefined; } }
  if (dark === undefined) document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
window.walletTheme = (dark) => applyTheme(!!dark);
window.walletBack = () => {
  if (S.locked) return false;
  if (!document.getElementById("photoView").hidden) { document.getElementById("photoView").hidden = true; return true; }
  if (S.sheet) { closeSheet(); return true; }
  if (S.route !== "home") { go("home"); return true; }
  return false;
};

/* ------------------------------------------------------------------ start */
async function start() {
  S.month = todayStr().slice(0, 7);
  const h = location.hash.slice(1); if (ROUTES.includes(h)) S.route = h;
  render();
  applyTheme();
  const db = LocalDB;
  S.db = db; S.canWrite = true;
  const timer = setTimeout(() => { if (COLLS.some((c) => !S.confirmed[c])) { S.slow = true; render(); } }, 10000);
  const settle = () => { if (COLLS.every((c) => S.confirmed[c])) { clearTimeout(timer); if (S.slow) { S.slow = false; } } };
  let pending = 0;
  const schedule = () => { if (pending) return; pending = requestAnimationFrame(() => { pending = 0; render(); }); };
  for (const c of COLLS) {
    db.collection(c).onSnapshot((snap) => {
      S.data[c] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      S.loaded[c] = true; if (!snap.metadata.fromCache) S.confirmed[c] = true;
      S.dbState = "ready"; settle(); schedule();
    }, (err) => { S.confirmed[c] = true; settle(); if (err && err.code !== "revoked") console.warn(c, err.code); schedule(); });
  }
  db.doc("config/main").onSnapshot((snap) => {
    const d = snap.exists ? snap.data() : {};
    S.cfg = { ...DEFAULTS, ...d, budgets: { ...(d.budgets || {}) }, zakat: { ...DEFAULTS.zakat, ...(d.zakat || {}) } };
    if (!S.lockChecked) { S.lockChecked = true; if (IS_APP && S.cfg.pinHash) showLock(); }
    schedule();
  }, () => {});
}
start();
})();
</script>
