  --board: #0F2A21; --board-ink: #EAF6F0; --board-dim: #8DB3A3; --euro: #E2B65C;

:root[data-theme="dark"] {

  --accent: #3DBF8E; --accent-ink: #052419; --accent-soft: #173B2E;

* { box-sizing: border-box; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);

.brand { flex: 1; min-width: 0; }

.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-width: 40px; height: 40px; padding: 0 12px;

.board .row { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13.5px; color: var(--board-dim); }

.chip.up { background: var(--good-soft); color: var(--good); }

.board .chip.down { background: rgba(255, 123, 111, .2); color: #FFB3AA; }

.btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; }

.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; box-shadow: var(--shadow); text-align: start; cursor: pointer; display: grid; gap: 2px; }
.tile .k { font-size: 12.5px; color: var(--muted); }
.tile .v { font-family: var(--font-display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .s { font-size: 12px; color: var(--muted); }
.tile.bad .v { color: var(--bad); } .tile.good .v { color: var(--good); } .tile.euro .v { color: var(--euro); }

.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 6px; cursor: pointer; display: grid; justify-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; }
.quick svg { width: 22px; height: 22px; color: var(--accent); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface2); border-radius: 12px; padding: 4px; gap: 4px; }

.list { display: grid; }

.item:last-child { border-bottom: 0; }
.item .t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }

.tag.good { background: var(--good-soft); color: var(--good); } .tag.neutral { background: var(--surface2); color: var(--muted); }
.stripe-bad { border-inline-start: 4px solid var(--bad); padding-inline-start: 10px; }
.stripe-warn { border-inline-start: 4px solid var(--warn); padding-inline-start: 10px; }

.bar { display: block; height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.bad i { background: var(--bad); } .bar.warn i { background: var(--warn); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: end; font-weight: 600; font-variant-numeric: tabular-nums; }

input[type=text], input[type=date], input[type=month], select { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 10px; font-size: 16px; }

/* ------------------------------------------------------------------ calculations */
function rateInfo() {
  const rs = S.data.rates.filter((r) => r.date && num(r.eur) > 0)
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : num(a.ts) - num(b.ts)));
  const usdEur = num(S.cfg.usdEur) || DEFAULTS.usdEur;
  if (!rs.length) return { eur: 0, buy: 0, usd: 0, date: null, prev: 0, list: rs, usdEstimated: true };
  const last = rs[rs.length - 1];
  const before = rs.filter((r) => r.date < last.date);
  const usdRows = rs.filter((r) => num(r.usd) > 0);
  return {
    eur: num(last.eur), buy: num(last.eurBuy) || num(last.eur), date: last.date,
    prev: before.length ? num(before[before.length - 1].eur) : 0,
    usd: usdRows.length ? num(usdRows[usdRows.length - 1].usd) : num(last.eur) * usdEur, usdEstimated: !usdRows.length, list: rs,
  };
}
function rateOn(date, cur) {
  const rows = S.data.rates.filter((r) => r.date === date && num(cur === "USD" ? r.usd : r.eur) > 0);
  return rows.length ? num(cur === "USD" ? rows[rows.length - 1].usd : rows[rows.length - 1].eur) : 0;
}
function toDa(amount, cur, R) { return num(amount) * (cur === "EUR" ? R.eur : cur === "USD" ? R.usd : 1); }
function salaryEur(row) {
  if (num(row.eurReal) > 0) return num(row.eurReal);
  const usd = row.usd === undefined || row.usd === "" ? num(S.cfg.salaryUsd) : num(row.usd);
  const k = row.usdEur === undefined || row.usdEur === "" ? num(S.cfg.usdEur) : num(row.usdEur);
  return usd * k * (1 - num(S.cfg.fee) / 100);
}
function salaryCalc(R) {
  const eur = num(S.cfg.salaryUsd) * num(S.cfg.usdEur) * (1 - num(S.cfg.fee) / 100);
  return { usd: num(S.cfg.salaryUsd), eur, da: eur * R.eur, official: eur * num(S.cfg.official) };
}
function eurBalance() {
  const rec = S.data.salary.reduce((s, r) => s + salaryEur(r), 0);
  const sold = S.data.sales.filter((x) => (x.cur || "EUR") === "EUR").reduce((s, x) => s + num(x.amount), 0);
  return rec - sold;
}
function debtList(R) {
  const today = todayStr();
  const paidBy = {};
  for (const p of S.data.payments) paidBy[p.debtId] = (paidBy[p.debtId] || 0) + num(p.amount);
  return S.data.debts.map((d) => {
    const paid = paidBy[d.id] || 0, rem = num(d.amount) - paid, cur = d.cur || "DZD";
    let status = "open", days = null;
    if (rem <= 0.0001) status = "paid";
    else if (d.due) { days = daysBetween(today, d.due); status = days < 0 ? "overdue" : days <= num(S.cfg.dueSoon) ? "soon" : "open"; }
    return { ...d, cur, paid, rem, remDa: toDa(rem, cur, R), status, days };
  });
}
function goalList(R) {
  const today = todayStr();
  const savedBy = {};
  for (const s of S.data.savings) savedBy[s.goalId] = (savedBy[s.goalId] || 0) + toDa(s.amount, s.cur || "DZD", R);
  return S.data.goals.map((g) => {
    const target = num(g.target), saved = savedBy[g.id] || 0, rem = Math.max(0, target - saved);
    const prog = target > 0 ? Math.min(1, Math.max(0, saved / target)) : 0;
    let monthsLeft = null;
    if (g.due) { const [y, m] = g.due.split("-").map(Number); const [ty, tm] = today.split("-").map(Number); monthsLeft = Math.max(0, (y - ty) * 12 + m - tm); }
    const perMonth = rem <= 0 ? 0 : monthsLeft ? rem / monthsLeft : rem;
    let st = "inProgress";
    if (target <= 0) st = "setTarget";
    else if (rem <= 0) st = "done";
    else if (saved <= 0) st = "notStarted";
    else if (g.start && g.due && g.due > g.start) {
      const expected = Math.min(1, Math.max(0, daysBetween(g.start, today) / daysBetween(g.start, g.due)));
      st = prog >= expected - 0.05 ? "onTrack" : "behind";
    }
    return { ...g, target, saved, rem, prog, monthsLeft, perMonth, st };
  });
}
function monthSummary(ym, R) {
  const inM = (d) => ymOf(d) === ym;
  const sal = S.data.salary.filter((r) => r.month === ym).reduce((s, r) => s + salaryEur(r), 0);
  const sales = S.data.sales.filter((x) => inM(x.date));
  const eurSold = sales.filter((x) => (x.cur || "EUR") === "EUR").reduce((s, x) => s + num(x.amount), 0);
  const daSales = sales.reduce((s, x) => s + num(x.amount) * num(x.rate), 0);
  const ex = S.data.expenses.filter((x) => inM(x.date));
  const otherIn = ex.filter((x) => x.kind === "income").reduce((s, x) => s + num(x.amount), 0);
  const spent = ex.filter((x) => x.kind !== "income").reduce((s, x) => s + num(x.amount), 0);
  const help = S.data.help.filter((x) => inM(x.date)).reduce((s, x) => s + num(x.amount), 0);
  const saved = S.data.savings.filter((x) => inM(x.date)).reduce((s, x) => s + toDa(x.amount, x.cur || "DZD", R), 0);
  const inn = daSales + otherIn, out = spent + help + saved;
  return { sal, eurSold, daSales, otherIn, spent, help, saved, inn, out, net: inn - out };
}
function rateStats(R) {
  const list = R.list;
  if (!list.length) return null;
  const within = (n) => list.filter((r) => daysBetween(r.date, R.date) < n && daysBetween(r.date, R.date) >= 0).map((r) => num(r.eur));
  const avg = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);
  const w30 = within(30);
  return { avg7: avg(within(7)), avg30: avg(w30), low30: Math.min(...w30), high30: Math.max(...w30), premium: num(S.cfg.official) > 0 ? R.eur / num(S.cfg.official) - 1 : 0 };
}

function rateChart(R) {
  const end = R.date || todayStr();
  const pts = R.list.filter((r) => { const d = daysBetween(r.date, end); return d >= 0 && d < 60; });
  if (pts.length < 2) return "";
  const W = 320, H = 150, padL = 34, padR = 10, padT = 12, padB = 22;
  const vals = pts.map((p) => num(p.eur));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 2) { lo -= 1; hi += 1; }
  const step = Math.max(1, Math.ceil((hi - lo) / 4));
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x0 = dayNum(end) - 59;
  const X = (d) => padL + ((dayNum(d) - x0) / 59) * (W - padL - padR);
  const Y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p.date).toFixed(1)},${Y(num(p.eur)).toFixed(1)}`).join("");
  const area = `${line}L${X(pts[pts.length - 1].date).toFixed(1)},${(H - padB).toFixed(1)}L${X(pts[0].date).toFixed(1)},${(H - padB).toFixed(1)}Z`;
  let grid = "";
  for (let v = lo; v <= hi + 0.001; v += step) grid += `<line x1="${padL}" x2="${W - padR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 5}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${esc(nf(v))}</text>`;
  const lastP = pts[pts.length - 1];
  const xl = [0, 30, 59].map((k) => { const d = new Date((x0 + k) * 864e5); const s = `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
    return `<text x="${X(s).toFixed(1)}" y="${H - 6}" text-anchor="${k === 0 ? "start" : k === 59 ? "end" : "middle"}">${esc(dmy(s).slice(0, 5))}</text>`; }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" dir="ltr" role="img" aria-label="${esc(t("chartTitle"))}">${grid}
    <path d="${area}" fill="var(--accent-soft)" stroke="none"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${X(lastP.date).toFixed(1)}" cy="${Y(num(lastP.eur)).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>${xl}</svg></div>`;
}

function vPlans() {
  const R = rateInfo(), G = goalList(R);
  const tot = G.reduce((s, g) => s + g.target, 0), sav = G.reduce((s, g) => s + g.saved, 0);
  const stTone = { done: "good", onTrack: "good", behind: "bad", notStarted: "neutral", inProgress: "neutral", setTarget: "warn" };
  const prioRank = { high: 0, med: 1, low: 2 };
  const rows = G.slice().sort((a, b) => (prioRank[a.prio] ?? 1) - (prioRank[b.prio] ?? 1) || (a.due || "9999").localeCompare(b.due || "9999"));
  const Z = S.cfg.zakat || DEFAULTS.zakat, D = debtList(R);
  const owedMe = D.filter((d) => d.dir !== "owe" && d.status !== "paid").reduce((s, d) => s + d.remDa, 0);
  const iOwe = D.filter((d) => d.dir === "owe" && d.status !== "paid").reduce((s, d) => s + d.remDa, 0);
  const wealth = Math.max(0, num(Z.cash) + Math.max(0, eurBalance()) * R.eur + num(Z.gold) * num(Z.goldPrice) + owedMe - iOwe);
  const nisab = 85 * num(Z.goldPrice), due = nisab > 0 && wealth >= nisab ? wealth * 0.025 : 0;
  return `<div class="two"><div class="stat"><span class="k">${esc(t("saved"))}</span><span class="v">${esc(da(sav))}</span></div>
    <div class="stat"><span class="k">${esc(t("target"))}</span><span class="v">${esc(da(tot))}</span></div></div>
    <button class="btn block" type="button" data-write data-act="form" data-form="goal">${ic("plus")}${esc(t("addGoal"))}</button>
    ${rows.length ? rows.map((g) => `<button class="card" type="button" data-act="goal" data-id="${esc(g.id)}" style="text-align:start;cursor:pointer;display:grid;gap:8px;width:100%">
      <span style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(g.name || "?")}</b><span class="tag ${stTone[g.st]}">${esc(t("st." + g.st))}</span></span>
      <span class="bar"><i style="width:${(g.prog * 100).toFixed(1)}%"></i></span>
      <span class="small muted num" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>${esc(da(g.saved))} / ${esc(da(g.target))} · ${esc(nf(g.prog * 100))}%</span>
        <span>${g.rem > 0 ? esc(t("perMonth", { v: da(g.perMonth) })) : ""}${g.monthsLeft != null && g.rem > 0 ? " · " + esc(t("monthsLeft", { n: g.monthsLeft })) : ""}</span></span></button>`).join("")

function writeError(e) {

async function withRetry(fn) {

}
async function saveDoc(coll, id, obj) {

    if (id) await withRetry(() => S.db.collection(coll).doc(id).set(body));

async function delDoc(coll, id) {

        if (req && n === 0) return toast(t("required", { f: t("f." + label) }));

async function deleteCurrent() {

    if (sh.kind === "goal") { const n = S.data.savings.filter((p) => p.goalId === sh.id).length; sh.note = n ? t("alsoSavings", { n }) : ""; }

    if (el.dataset.debt) extra.debtId = el.dataset.debt;
    if (el.dataset.goal) extra.goalId = el.dataset.goal;
    if (el.dataset.form === "saving" && !S.data.goals.length) { go("plans"); return toast(t("empty.goals")); }
    if (el.dataset.form === "rate") { const today = S.data.rates.filter((r) => r.date === todayStr()).sort((x, y) => num(x.ts) - num(y.ts)).pop(); if (today) return openForm("rate", today); }
    openForm(el.dataset.form, null, extra);
  }
  else if (a === "edit") {
    const F = FORMS[el.dataset.form]; const item = S.data[F.coll].find((x) => x.id === el.dataset.id);
    if (item) openForm(el.dataset.form, item);
  }
  else if (a === "debt" || a === "goal") { S.sheet = { type: a, id: el.dataset.id }; renderSheet(); }
  else if (a === "cfg") { S.sheet = { type: "cfg", vals: { ...S.cfg } }; renderSheet(); }
  else if (a === "zakat") { S.sheet = { type: "zakat", vals: { ...DEFAULTS.zakat, ...(S.cfg.zakat || {}) } }; renderSheet(); }
  else if (a === "budget") { if (S.canWrite === false) return; S.sheet = { type: "budget", cat: el.dataset.cat, vals: { amount: num((S.cfg.budgets || {})[el.dataset.cat]) || "" } }; renderSheet(); }
  else if (a === "close") closeSheet();
  else if (a === "del") deleteCurrent();
  else if (a === "export") exportXlsx();
});
document.addEventListener("submit", (e) => { if (e.target.id === "theForm") { e.preventDefault(); submitForm(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) closeSheet(); });
document.addEventListener("input", (e) => {
  const k = e.target.dataset && e.target.dataset.conv; if (!k) return;
  S.conv[k] = e.target.value;
  const R = rateInfo(), v = parseNum(e.target.value) || 0;
  const out = { eur: ["cvEurOut", "= " + da(v * R.eur)], da: ["cvDaOut", "= " + eu(R.buy ? v / R.buy : 0)], usd: ["cvUsdOut", "= " + da(v * R.usd)] }[k];
  document.getElementById(out[0]).textContent = out[1];
});
document.addEventListener("focusout", () => { setTimeout(() => { if (S.dirty) render(); }, 0); });
window.addEventListener("hashchange", () => { const r = location.hash.slice(1); if (ROUTES.includes(r) && r !== S.route) { S.route = r; render(); } });

/* ------------------------------------------------------------------ start */
async function start() {
  S.month = todayStr().slice(0, 7);
  const h = location.hash.slice(1); if (ROUTES.includes(h)) S.route = h;
  render();
  const C = window.claude;
  const [db, user] = C && C.use ? await Promise.all([C.use("db"), C.use("user")]) : [null, null];
  if (!db) { S.dbState = "none"; render(); return; }
  S.db = db;
  if (user) { try { const w = await user.can("data.write"); S.canWrite = w === null || w === undefined ? null : !!w; } catch (e) { /* keep inputs */ } }
  const timer = setTimeout(() => { if (COLLS.some((c) => !S.confirmed[c])) { S.slow = true; render(); } }, 10000);
  const settle = () => { if (COLLS.every((c) => S.confirmed[c])) { clearTimeout(timer); if (S.slow) { S.slow = false; } } };
  let pending = 0;
  const schedule = () => { if (pending) return; pending = requestAnimationFrame(() => { pending = 0; render(); }); };
  for (const c of COLLS) {
    db.collection(c).onSnapshot((snap) => {
      S.data[c] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      S.loaded[c] = true; if (!snap.metadata.fromCache) S.confirmed[c] = true;
      S.dbState = "ready"; settle(); schedule();
    }, (err) => { S.confirmed[c] = true; settle(); if (err && err.code !== "revoked") console.warn(c, err.code); schedule(); });
  }
  db.doc("config/main").onSnapshot((snap) => {
    const d = snap.exists ? snap.data() : {};
    S.cfg = { ...DEFAULTS, ...d, budgets: { ...(d.budgets || {}) }, zakat: { ...DEFAULTS.zakat, ...(d.zakat || {}) } };
    schedule();
  }, () => {});
}
start();
})();
</script>
